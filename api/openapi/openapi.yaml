openapi: 3.0.3
info:
  title: Bora Jogar API
  version: 0.1.0
paths:
  /api/v1/auth/google:
    get:
      summary: Start Google OAuth login
      parameters:
        - in: query
          name: invitation
          schema: { type: string }
      responses: { '302': { description: Redirect to Google } }
  /api/v1/auth/google/callback:
    get:
      summary: Complete Google OAuth login
      responses: { '302': { description: Redirect to application } }
  /api/v1/auth/logout:
    post:
      summary: End current session
      responses: { '204': { description: Session ended }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/v1/me:
    get:
      summary: Get current user
      responses:
        '200': { $ref: '#/components/responses/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/me/profile:
    get:
      summary: Get authenticated player's profile
      security: [{ cookieAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Profile' }, '401': { $ref: '#/components/responses/Unauthorized' } }
    put:
      summary: Update authenticated player's profile
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileInput' } } } }
      responses: { '200': { $ref: '#/components/responses/Profile' }, '401': { $ref: '#/components/responses/Unauthorized' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/me/onboarding:
    get: { summary: Get onboarding progress, security: [{ cookieAuth: [] }], responses: { '200': { $ref: '#/components/responses/OnboardingProgress' } } }
    put:
      summary: Save onboarding progress
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingProgress' } } } }
      responses: { '200': { $ref: '#/components/responses/OnboardingProgress' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/me/onboarding/complete:
    post: { summary: Complete onboarding, security: [{ cookieAuth: [] }], responses: { '204': { description: Completed }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /api/v1/users/{userId}/public-profile:
    get:
      summary: Get limited profile for a relevant player
      security: [{ cookieAuth: [] }]
      parameters: [{ in: path, name: userId, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { $ref: '#/components/responses/PublicProfile' }, '404': { description: Profile unavailable } }
  /api/v1/admin/invitations:
    get: { summary: List invitations, responses: { '200': { description: Invitation list } } }
    post: { summary: Create invitation, responses: { '201': { description: Created }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /api/v1/admin/invitations/{invitationId}/disable:
    post:
      summary: Disable invitation
      parameters: [{ in: path, name: invitationId, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Disabled }, '403': { $ref: '#/components/responses/Forbidden' } }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: borajogar_session }
  schemas:
    ProfileInput:
      type: object
      required: [displayName, timeZone, skillLevel, styles, preferredGameDurationMinutes, minimumNoticeMinutes]
      properties:
        displayName: { type: string, minLength: 2, maxLength: 80 }
        timeZone: { type: string }
        skillLevel: { type: string, enum: [learning, beginner, intermediate, advanced, competitive] }
        bio: { type: string, maxLength: 280, nullable: true }
        styles: { type: array, minItems: 1, items: { type: string, enum: [casual, competitive, training_focused, mixed] } }
        preferredGameDurationMinutes: { type: integer, enum: [60, 90, 120] }
        minimumNoticeMinutes: { type: integer, minimum: 0, maximum: 10080 }
        activeForMatchmaking: { type: boolean }
    OnboardingProgress:
      type: object
      required: [currentStep, completedSteps]
      properties:
        currentStep: { type: integer, minimum: 0, maximum: 8 }
        completedSteps: { type: array, items: { type: integer, minimum: 0, maximum: 8 } }
  responses:
    Unauthorized: { description: Authentication required }
    Forbidden: { description: Administrator access required }
    CurrentUser: { description: Current authenticated user }
    Profile: { description: Player profile }
    PublicProfile: { description: Limited player profile }
    OnboardingProgress: { description: Onboarding progress }
    ValidationError: { description: Validation failed }
