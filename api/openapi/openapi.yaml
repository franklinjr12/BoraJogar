openapi: 3.0.3
info:
  title: Bora Jogar API
  version: 0.1.0
paths:
  /health/live:
    get: { summary: Liveness check, responses: { '200': { description: Process is alive } } }
  /health/ready:
    get: { summary: Readiness check, responses: { '200': { description: Dependencies are ready }, '503': { description: Dependencies are unavailable } } }
  /api/v1/auth/google:
    get:
      summary: Start Google OAuth login
      parameters:
        - in: query
          name: invitation
          schema: { type: string }
      responses: { '302': { description: Redirect to Google } }
  /api/v1/auth/google/callback:
    get:
      summary: Complete Google OAuth login
      responses: { '302': { description: Redirect to application } }
  /api/v1/auth/logout:
    post:
      summary: End current session
      responses: { '204': { description: Session ended }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/v1/me:
    get:
      summary: Get current user
      responses:
        '200': { $ref: '#/components/responses/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/me/profile:
    get:
      summary: Get authenticated player's profile
      security: [{ cookieAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Profile' }, '401': { $ref: '#/components/responses/Unauthorized' } }
    put:
      summary: Update authenticated player's profile
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileInput' } } } }
      responses: { '200': { $ref: '#/components/responses/Profile' }, '401': { $ref: '#/components/responses/Unauthorized' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/me/onboarding:
    get: { summary: Get onboarding progress, security: [{ cookieAuth: [] }], responses: { '200': { $ref: '#/components/responses/OnboardingProgress' } } }
    put:
      summary: Save onboarding progress
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingProgress' } } } }
      responses: { '200': { $ref: '#/components/responses/OnboardingProgress' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/me/onboarding/complete:
    post: { summary: Complete onboarding, security: [{ cookieAuth: [] }], responses: { '204': { description: Completed }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /api/v1/users/{userId}/public-profile:
    get:
      summary: Get limited profile for a relevant player
      security: [{ cookieAuth: [] }]
      parameters: [{ in: path, name: userId, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { $ref: '#/components/responses/PublicProfile' }, '404': { description: Profile unavailable } }
  /api/v1/admin/invitations:
    get: { summary: List invitations, responses: { '200': { description: Invitation list } } }
    post: { summary: Create invitation, responses: { '201': { description: Created }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /api/v1/admin/invitations/{invitationId}/disable:
    post:
      summary: Disable invitation
      parameters: [{ in: path, name: invitationId, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Disabled }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/venues:
    get:
      summary: List approved venues
      security: [{ cookieAuth: [] }]
      parameters:
        - { in: query, name: city, schema: { type: string } }
        - { in: query, name: latitude, schema: { type: number, format: double, minimum: -90, maximum: 90 } }
        - { in: query, name: longitude, schema: { type: number, format: double, minimum: -180, maximum: 180 } }
      responses: { '200': { description: Approved venues, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Venue' } } } } }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/venues/{venueId}:
    get:
      summary: Get approved venue
      security: [{ cookieAuth: [] }]
      parameters: [{ in: path, name: venueId, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Venue, content: { application/json: { schema: { $ref: '#/components/schemas/Venue' } } } }, '404': { description: Venue unavailable } }
  /api/v1/venues/suggestions:
    post:
      summary: Suggest a venue for approval
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VenueSuggestionInput' } } } }
      responses: { '201': { description: Pending venue suggestion }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/me/preferred-areas:
    get: { summary: List current user's preferred areas, security: [{ cookieAuth: [] }], responses: { '200': { description: Preferred areas } } }
    post:
      summary: Create preferred area
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PreferredAreaInput' } } } }
      responses: { '201': { description: Preferred area created }, '409': { description: Area limit reached }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/me/preferred-areas/{areaId}:
    put:
      summary: Update preferred area
      security: [{ cookieAuth: [] }]
      parameters: [{ in: path, name: areaId, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PreferredAreaInput' } } } }
      responses: { '200': { description: Preferred area }, '404': { description: Area unavailable }, '422': { $ref: '#/components/responses/ValidationError' } }
    delete:
      summary: Deactivate preferred area
      security: [{ cookieAuth: [] }]
      parameters: [{ in: path, name: areaId, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Area removed }, '404': { description: Area unavailable } }
  /api/v1/me/favorite-venues:
    get: { summary: List favorite venues, security: [{ cookieAuth: [] }], responses: { '200': { description: Favorite venues } } }
  /api/v1/me/favorite-venues/{venueId}:
    post: { summary: Favorite venue, security: [{ cookieAuth: [] }], parameters: [{ in: path, name: venueId, required: true, schema: { type: string, format: uuid } }], responses: { '204': { description: Favorited }, '404': { description: Venue unavailable } } }
    delete: { summary: Unfavorite venue, security: [{ cookieAuth: [] }], parameters: [{ in: path, name: venueId, required: true, schema: { type: string, format: uuid } }], responses: { '204': { description: Unfavorited }, '404': { description: Favorite unavailable } } }
  /api/v1/admin/venues/suggestions:
    get: { summary: List pending venue suggestions, security: [{ cookieAuth: [] }], responses: { '200': { description: Pending suggestions }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /api/v1/admin/venues/suggestions/{suggestionId}/{action}:
    post:
      summary: Approve or reject venue suggestion
      security: [{ cookieAuth: [] }]
      parameters:
        - { in: path, name: suggestionId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: action, required: true, schema: { type: string, enum: [approve, reject] } }
      responses: { '204': { description: Suggestion reviewed }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { description: Suggestion unavailable } }
  /api/v1/me/availability/rules:
    get: { summary: List recurring availability rules, security: [{ cookieAuth: [] }], responses: { '200': { description: Availability rules } } }
    post: { summary: Create recurring availability rule, security: [{ cookieAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AvailabilityRuleInput' } } } }, responses: { '201': { description: Created }, '409': { description: Overlapping rule }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /api/v1/me/availability/rules/{ruleId}:
    put: { summary: Update recurring availability rule, security: [{ cookieAuth: [] }], parameters: [{ in: path, name: ruleId, required: true, schema: { type: string, format: uuid } }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AvailabilityRuleInput' } } } }, responses: { '200': { description: Updated }, '409': { description: Overlapping rule }, '422': { $ref: '#/components/responses/ValidationError' } } }
    delete: { summary: Delete recurring availability rule, security: [{ cookieAuth: [] }], parameters: [{ in: path, name: ruleId, required: true, schema: { type: string, format: uuid } }], responses: { '204': { description: Deleted } } }
  /api/v1/me/availability/exceptions:
    get: { summary: List availability exceptions, security: [{ cookieAuth: [] }], responses: { '200': { description: Exceptions } } }
    post: { summary: Create availability exception, security: [{ cookieAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AvailabilityExceptionInput' } } } }, responses: { '201': { description: Created }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /api/v1/me/availability/exceptions/{exceptionId}:
    delete: { summary: Delete availability exception, security: [{ cookieAuth: [] }], parameters: [{ in: path, name: exceptionId, required: true, schema: { type: string, format: uuid } }], responses: { '204': { description: Deleted } } }
  /api/v1/me/availability/calendar:
      get: { summary: Get computed availability calendar, security: [{ cookieAuth: [] }], parameters: [{ in: query, name: from, required: true, schema: { type: string, format: date } }, { in: query, name: to, required: true, schema: { type: string, format: date } }], responses: { '200': { description: Computed availability }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /api/v1/games:
    get:
      summary: List games visible to current user
      security: [{ cookieAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses: { '200': { description: Games, content: { application/json: { schema: { $ref: '#/components/schemas/GamePage' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '422': { $ref: '#/components/responses/ValidationError' } }
    post:
      summary: Create manual game
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GameInput' } } } }
      responses: { '201': { description: Game created }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/games/{gameId}:
    get:
      summary: Get game details
      security: [{ cookieAuth: [] }]
      parameters: [{ in: path, name: gameId, required: true, schema: { type: string, format: uuid } }, { in: query, name: access, schema: { type: string } }]
      responses: { '200': { description: Game details }, '404': { description: Game unavailable } }
    put:
      summary: Update game notes
      security: [{ cookieAuth: [] }]
      parameters: [{ in: path, name: gameId, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GameUpdate' } } } }
      responses: { '200': { description: Updated game }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/games/{gameId}/calendar.ics:
    get:
      summary: Export game as iCalendar event
      security: [{ cookieAuth: [] }]
      parameters: [{ in: path, name: gameId, required: true, schema: { type: string, format: uuid } }, { in: query, name: access, schema: { type: string } }]
      responses: { '200': { description: iCalendar event, content: { text/calendar: { schema: { type: string } } } }, '404': { description: Game unavailable } }
  /api/v1/games/{gameId}/join:
    post: { summary: Join game or waitlist, security: [{ cookieAuth: [] }], parameters: [{ in: path, name: gameId, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Join result }, '409': { description: Join rejected } } }
  /api/v1/games/{gameId}/leave:
    post: { summary: Leave game, security: [{ cookieAuth: [] }], parameters: [{ in: path, name: gameId, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Leave result } } }
  /api/v1/games/{gameId}/cancel:
    post: { summary: Cancel game, security: [{ cookieAuth: [] }], parameters: [{ in: path, name: gameId, required: true, schema: { type: string, format: uuid } }], requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/GameCancellation' } } } }, responses: { '204': { description: Cancelled }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /api/v1/games/{gameId}/waitlist:
    post: { summary: Add to waitlist, security: [{ cookieAuth: [] }], parameters: [{ in: path, name: gameId, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Waitlisted } } }
    delete: { summary: Remove from waitlist, security: [{ cookieAuth: [] }], parameters: [{ in: path, name: gameId, required: true, schema: { type: string, format: uuid } }], responses: { '204': { description: Removed } } }
  /api/v1/notifications:
    get:
      summary: List current user's notifications
      security: [{ cookieAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses: { '200': { $ref: '#/components/responses/Notifications' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/v1/notifications/{id}/read:
    post:
      summary: Mark notification as read
      security: [{ cookieAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Marked as read }, '404': { description: Notification unavailable } }
  /api/v1/notifications/read-all:
    post:
      summary: Mark all notifications as read
      security: [{ cookieAuth: [] }]
      responses: { '204': { description: Marked as read } }
  /api/v1/games/{gameId}/attendance:
    get:
      summary: View private game attendance
      security: [{ cookieAuth: [] }]
      parameters: [{ in: path, name: gameId, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Attendance }, '403': { $ref: '#/components/responses/Forbidden' } }
    put:
      summary: Record player attendance
      security: [{ cookieAuth: [] }]
      parameters: [{ in: path, name: gameId, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AttendanceInput' } } } }
      responses: { '204': { description: Recorded }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /api/v1/me/reliability:
    get: { summary: Get private reliability summary, security: [{ cookieAuth: [] }], responses: { '200': { $ref: '#/components/responses/Reliability' } } }
  /api/v1/users/{userId}/block:
    post: { summary: Privately block user, security: [{ cookieAuth: [] }], parameters: [{ in: path, name: userId, required: true, schema: { type: string, format: uuid } }], responses: { '204': { description: Blocked }, '404': { description: User unavailable } } }
    delete: { summary: Remove private block, security: [{ cookieAuth: [] }], parameters: [{ in: path, name: userId, required: true, schema: { type: string, format: uuid } }], responses: { '204': { description: Unblocked } } }
  /api/v1/me/blocked-users:
    get: { summary: List private blocks, security: [{ cookieAuth: [] }], responses: { '200': { description: Blocked users } } }
  /api/v1/reports:
    post: { summary: File safety report, security: [{ cookieAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReportInput' } } } }, responses: { '201': { description: Report filed }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /api/v1/reports/{reportId}:
    get: { summary: View own report, security: [{ cookieAuth: [] }], parameters: [{ in: path, name: reportId, required: true, schema: { type: string, format: uuid } }], responses: { '200': { description: Report }, '404': { description: Report unavailable } } }
  /api/v1/me/delete:
    post: { summary: Request account deletion, security: [{ cookieAuth: [] }], responses: { '204': { description: Account deleted and sessions revoked } } }
  /api/v1/admin/dashboard:
    get: { summary: Private beta dashboard, security: [{ cookieAuth: [] }], responses: { '200': { description: Dashboard }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /api/v1/admin/metrics:
    get: { summary: Request metrics, security: [{ cookieAuth: [] }], responses: { '200': { description: HTTP request metrics }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /api/v1/admin/users:
    get: { summary: Search users, security: [{ cookieAuth: [] }], parameters: [{ in: query, name: q, schema: { type: string } }], responses: { '200': { description: Users }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /api/v1/admin/matchmaking/runs:
    get: { summary: Inspect matchmaking runs, security: [{ cookieAuth: [] }], responses: { '200': { description: Runs }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /api/v1/admin/reports:
    get: { summary: Review reports, security: [{ cookieAuth: [] }], responses: { '200': { description: Reports }, '403': { $ref: '#/components/responses/Forbidden' } } }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: borajogar_session }
  schemas:
    ProfileInput:
      type: object
      required: [displayName, timeZone, skillLevel, styles, preferredGameDurationMinutes, minimumNoticeMinutes]
      properties:
        displayName: { type: string, minLength: 2, maxLength: 80 }
        timeZone: { type: string }
        skillLevel: { type: string, enum: [learning, beginner, intermediate, advanced, competitive] }
        bio: { type: string, maxLength: 280, nullable: true }
        styles: { type: array, minItems: 1, items: { type: string, enum: [casual, competitive, training_focused, mixed] } }
        preferredGameDurationMinutes: { type: integer, enum: [60, 90, 120] }
        minimumNoticeMinutes: { type: integer, minimum: 0, maximum: 10080 }
        activeForMatchmaking: { type: boolean }
    OnboardingProgress:
      type: object
      required: [currentStep, completedSteps]
      properties:
        currentStep: { type: integer, minimum: 0, maximum: 8 }
        completedSteps: { type: array, items: { type: integer, minimum: 0, maximum: 8 } }
    Venue:
      type: object
      required: [id, name, city, latitude, longitude, lightingStatus, surfaceType, accessType, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        addressLabel: { type: string, nullable: true }
        city: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        lightingStatus: { type: string, enum: [unknown, no_lighting, has_lighting] }
        surfaceType: { type: string, enum: [unknown, sand, grass, hard_court, other] }
        accessType: { type: string, enum: [public, private, paid_entry, unknown] }
        active: { type: boolean }
        distanceMeters: { type: number, format: double, nullable: true }
    PreferredAreaInput:
      type: object
      required: [label, latitude, longitude, radiusMeters]
      properties:
        label: { type: string, minLength: 1, maxLength: 120 }
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        radiusMeters: { type: integer, minimum: 500, maximum: 25000 }
        priority: { type: integer, minimum: 0 }
    VenueSuggestionInput:
      type: object
      required: [name, city, latitude, longitude]
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        description: { type: string, nullable: true }
        addressLabel: { type: string, nullable: true }
        city: { type: string, minLength: 1, maxLength: 120 }
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
    AvailabilityRuleInput:
      type: object
      required: [weekday, start, end, timezone, validFrom]
      properties:
        weekday: { type: integer, minimum: 0, maximum: 6 }
        start: { type: string }
        end: { type: string }
        timezone: { type: string }
        validFrom: { type: string, format: date }
        validUntil: { type: string, format: date, nullable: true }
        active: { type: boolean }
        venueIds: { type: array, items: { type: string, format: uuid } }
        preferredAreaIds: { type: array, items: { type: string, format: uuid } }
    AvailabilityExceptionInput:
      type: object
      required: [date, type, timezone]
      properties:
        date: { type: string, format: date }
        type: { type: string, enum: [unavailable_all_day, unavailable_interval, available_interval] }
        start: { type: string, nullable: true }
        end: { type: string, nullable: true }
        timezone: { type: string }
    Game:
      type: object
      required: [id, startsAt, endsAt, venueId, venueName, capacity, confirmedPlayers, openSlots, minimumSkillLevel, maximumSkillLevel, visibility, status]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, nullable: true }
        description: { type: string, nullable: true }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        venueId: { type: string, format: uuid }
        venueName: { type: string }
        addressLabel: { type: string, nullable: true }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        capacity: { type: integer, minimum: 2, maximum: 12 }
        confirmedPlayers: { type: integer, minimum: 0 }
        openSlots: { type: integer, minimum: 0 }
        minimumSkillLevel: { type: string, enum: [learning, beginner, intermediate, advanced, competitive] }
        maximumSkillLevel: { type: string, enum: [learning, beginner, intermediate, advanced, competitive] }
        visibility: { type: string, enum: [public, link-only, private] }
        status: { type: string, enum: [scheduled, cancelled, completed] }
    GameInput:
      type: object
      required: [startsAt, venueId, capacity, minimumSkillLevel, maximumSkillLevel, visibility]
      properties:
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, nullable: true }
        durationMinutes: { type: integer, enum: [60, 90, 120] }
        venueId: { type: string, format: uuid }
        capacity: { type: integer, minimum: 2, maximum: 12 }
        minimumSkillLevel: { type: string, enum: [learning, beginner, intermediate, advanced, competitive] }
        maximumSkillLevel: { type: string, enum: [learning, beginner, intermediate, advanced, competitive] }
        visibility: { type: string, enum: [public, link-only, private] }
        title: { type: string, maxLength: 120, nullable: true }
        description: { type: string, maxLength: 2000, nullable: true }
    GameUpdate:
      type: object
      properties: { title: { type: string, maxLength: 120, nullable: true }, description: { type: string, maxLength: 2000, nullable: true } }
    GameCancellation:
      type: object
      properties: { reason: { type: string, maxLength: 500, nullable: true } }
    AttendanceInput:
      type: object
      required: [userId, status]
      properties:
        userId: { type: string, format: uuid }
        status: { type: string, enum: [unknown, attended, no_show] }
    ReportInput:
      type: object
      required: [category, description]
      properties:
        reportedUserId: { type: string, format: uuid, nullable: true }
        gameId: { type: string, format: uuid, nullable: true }
        category: { type: string, enum: [harassment, unsafe_behavior, repeated_no_show, false_profile, inappropriate_content, other] }
        description: { type: string, minLength: 1, maxLength: 2000 }
        blockReportedUser: { type: boolean }
    Reliability:
      type: object
      properties:
        gamesConfirmed: { type: integer }
        gamesAttended: { type: integer }
        earlyCancellations: { type: integer }
        lateCancellations: { type: integer }
        noShows: { type: integer }
        sufficientHistory: { type: boolean }
        matchmakingValue: { type: number, format: double }
    Notification:
      type: object
      required: [id, userId, type, title, body, payload, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        actionUrl: { type: string, nullable: true }
        payload: { type: object, additionalProperties: true }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    PageMeta:
      type: object
      required: [page, pageSize, hasMore]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        hasMore: { type: boolean }
    GamePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Game' } }
    ApiError:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message, fields]
          properties:
            code: { type: string }
            message: { type: string }
            fields: { type: object, additionalProperties: { type: string } }
        requestId: { type: string }
  responses:
    Unauthorized: { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    Forbidden: { description: Administrator access required, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    CurrentUser: { description: Current authenticated user }
    Profile: { description: Player profile }
    PublicProfile: { description: Limited player profile }
    Reliability: { description: Private reliability summary, content: { application/json: { schema: { $ref: '#/components/schemas/Reliability' } } } }
    OnboardingProgress: { description: Onboarding progress }
    Notifications:
      description: Notification page
      content:
        application/json:
          schema:
            type: object
            allOf:
              - $ref: '#/components/schemas/PageMeta'
              - type: object
                required: [items, unreadCount]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
                  unreadCount: { type: integer, minimum: 0 }
    ValidationError: { description: Validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
